<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABS Challenge Analytics</title>
<!-- GitHub Pages serves this file at https://<user>.github.io/<repo>/ .
     The dashboard itself lives in dashboard/, so this page sends visitors
     straight there (keeping a link like …/#model pointed at the same tab). -->
<meta http-equiv="refresh" content="0; url=dashboard/">
<link rel="canonical" href="dashboard/">
<script>location.replace("dashboard/" + location.hash);</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #fdf7f9; color: #5f4e58; font: 15px/1.6 "Poppins", "Helvetica Neue", Arial, sans-serif; }
  a { color: #b8336f; font-weight: 600; }
  @media (prefers-color-scheme: dark) { body { background: #1a1317; color: #d6c4cd; } a { color: #f39ac0; } }
</style>
</head>
<body>
  <p>Opening the dashboard&hellip; if nothing happens, <a href="dashboard/">click here</a>.</p>
</body>
</html>
